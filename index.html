<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vocab Drill — Chinese → Japanese</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>Vocab Drill — Chinese → Japanese</h1>

    <div class="controls">
      <div class="fileupload">
        <label class="file-label" for="fileInput">Upload CSV / JSON</label>
        <input type="file" id="fileInput" accept=".csv,.json,text/csv,application/json">
        <div class="hint">Or host <code>items.json</code> in site root for shared DB</div>
      </div>

      <div class="category-panel">
        <strong>Categories</strong>
        <div class="category-list" id="categoryList"></div>
      </div>
    </div>

    <div class="buttons">
      <button class="btn" id="startBtn">Start / Shuffle</button>
      <button class="btn primary" id="revealNextBtn">Reveal</button>
      <button class="btn" id="prevBtn">Previous</button>
    </div>

    <div class="status" id="status">Loading...</div>

    <div class="card">
      <div class="chi" id="chi">—</div>
      <div class="jpn" id="jpn">—</div>
      <div class="kana" id="kana">—</div>
    </div>

    <div class="footer">
      Data format for items.json: an array of objects with keys "chi","jpn","kana" and optional "cat".
      Example: [{"chi":"一","jpn":"一","kana":"いち","cat":"number"}]
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
